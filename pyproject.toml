[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deepagents-lab"
version = "0.1.0"
description = "Local-first experiments and evaluations for the DeepAgents OSS library."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.8",
    "inspect-ai==0.3.260",
    "langchain-openai>=1.1,<2",
]

[project.scripts]
deepagents-live = "deepagents_lab.live:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.31",
    "pytest>=8.4,<10",
]
langsmith-control = [
    "langsmith==0.11.1",
]
