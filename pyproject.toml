[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deepagents-lab"
version = "0.1.0"
description = "Local-first experiments and evaluations for the DeepAgents OSS library."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.8",
    "inspect-ai==0.3.260",
    "langchain-openai>=1.1,<2",
]

[project.scripts]
deepagents-live = "deepagents_lab.live:main"
deepagents-server = "deepagents_lab.server_cli:main"
deepagents-ui = "deepagents_lab.ui_cli:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.31",
    "pytest>=8.4,<10",
]
langsmith-control = [
    "langsmith==0.11.1",
]
notebooks = [
    "jupyterlab==4.6.3",
    "jupytext==1.19.5",
    "langchain-quickjs==0.3.5",
    "numpy>=2.3,<3",
    "python-dotenv==1.2.3",
]

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "kernelspec,jupytext"
cell_metadata_filter = "tags"
